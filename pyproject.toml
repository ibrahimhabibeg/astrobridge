[project]
name = "astrobridge"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
  "ads>=0.12.7",
  "astropy>=8.0.1",
  "astroquery>=0.4.11",
  "datasets>=5.0.0",
  "duckdb>=1.5.5",
  "google-genai>=2.16.0",
  "huggingface-hub>=1.24.0",
  "ipykernel>=7.3.0",
  "ipywidgets>=8.1.8",
  "jinja2>=3.1.6",
  "lsdb>=0.10.4",
  "matplotlib>=3.11.1",
  "numpy>=2.4.6",
  "pandas>=2.3.3",
  "pyarrow>=25.0.0",
  "python-dotenv>=1.2.2",
  "pyvo>=1.9.1",
  "requests>=2.32.0",
  "scipy>=1.18.0",
  "tqdm>=4.67.0",
]

[dependency-groups]
dev = [
  "pytest>=9.1.1",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["astrobridge", "astrobridge.*"]
